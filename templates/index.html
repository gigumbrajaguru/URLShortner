<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 48px;
      width: 100%;
      max-width: 560px;
    }
    h1 { font-size: 1.8rem; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { color: #666; margin-bottom: 28px; font-size: 0.95rem; }
    .subtitle code { color: #4f46e5; font-size: 0.85rem; word-break: break-all; }
    label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; }
    input[type="url"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus { border-color: #4f46e5; }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .result {
      margin-top: 24px;
      padding: 16px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      display: none;
    }
    .result p { color: #166534; font-size: 0.9rem; margin-bottom: 6px; }
    .result a {
      color: #4f46e5;
      font-weight: 600;
      word-break: break-all;
      text-decoration: none;
    }
    .result a:hover { text-decoration: underline; }
    .result-actions { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
    .copy-btn {
      margin-top: 0;
      width: auto;
      padding: 7px 18px;
      font-size: 0.85rem;
    }
    .result .info-link { font-size: 0.85rem; font-weight: 500; }
    .error-msg, .server-error {
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #991b1b;
      font-size: 0.9rem;
    }
    .error-msg { margin-top: 16px; display: none; }
    .server-error { margin-bottom: 20px; }
    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>URL Shortener</h1>
    <p class="subtitle">
      Paste a long link, get a short one like <code>{{.BaseURL}}/aB3xYz</code>.
      Visitors see a brief ad before continuing.
    </p>

    {{if .Error}}
    <div class="server-error" role="alert">{{.Error}}</div>
    {{end}}

    <form id="shorten-form" novalidate>
      <label for="url-input">Long URL</label>
      <input type="url" id="url-input" name="url" inputmode="url" maxlength="2048"
             placeholder="https://example.com/very/long/path/to/article" autocomplete="off" required>
      <button type="submit" id="shorten-btn">Shorten URL</button>
    </form>

    <div class="error-msg" id="error-msg" role="alert"></div>

    <div class="result" id="result" aria-live="polite">
      <p>Your short URL is ready:</p>
      <a id="short-link" href="#" target="_blank" rel="noopener"></a>
      <div class="result-actions">
        <button type="button" class="copy-btn" id="copy-btn">Copy Link</button>
        <a class="info-link" id="info-link" href="#" target="_blank" rel="noopener">View stats</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('shorten-form');
    const input = document.getElementById('url-input');
    const btn = document.getElementById('shorten-btn');
    const errorDiv = document.getElementById('error-msg');
    const resultDiv = document.getElementById('result');
    const shortLink = document.getElementById('short-link');
    const infoLink = document.getElementById('info-link');
    const copyBtn = document.getElementById('copy-btn');
    let busy = false;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return;

      errorDiv.style.display = 'none';

      let url = input.value.trim();
      if (!url) {
        showError('Please enter a URL.');
        return;
      }
      // Accept bare domains such as "example.com/page".
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) url = 'https://' + url;

      resultDiv.style.display = 'none';
      busy = true;
      btn.disabled = true;
      btn.textContent = 'Shortening...';

      try {
        const resp = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.short_url) {
          shortLink.href = data.short_url;
          shortLink.textContent = data.short_url;
          infoLink.href = '/info/' + encodeURIComponent(data.short_code);
          copyBtn.textContent = 'Copy Link';
          resultDiv.style.display = 'block';
          input.value = '';
        } else {
          showError(data.error || 'Something went wrong (HTTP ' + resp.status + ').');
        }
      } catch (err) {
        showError('Network error. Please try again.');
      } finally {
        busy = false;
        btn.disabled = false;
        btn.textContent = 'Shorten URL';
      }
    });

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }

    // navigator.clipboard only exists on HTTPS/localhost; fall back to a
    // hidden textarea so copying also works over plain HTTP.
    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) { /* fall through */ }
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
      return ok;
    }

    copyBtn.addEventListener('click', async () => {
      const ok = await copyText(shortLink.textContent);
      copyBtn.textContent = ok ? 'Copied!' : 'Copy failed';
      setTimeout(() => { copyBtn.textContent = 'Copy Link'; }, 2000);
    });
  </script>
</body>
</html>
